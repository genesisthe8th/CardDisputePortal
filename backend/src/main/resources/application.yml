spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/card_dispute
    username: devuser
    password: devpassword
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: INFO
